# Edge reverse proxy per the architecture doc §13:
#   /        -> frontend container (React static build)
#   /api     -> backend container (Node/NestJS)
#   /uploads -> secure file storage (mount your upload volume here)
#
# This container listens on 8080 (unprivileged image — no root user inside
# the container); docker-compose publishes it to the host's port 80, so
# nothing outside changes. In production, put this behind Dokploy's own
# HTTPS-terminating proxy, or add a `listen 8443 ssl;` server block with
# your certificate paths and publish host 443 -> container 8443 — see the
# architecture doc §11/§13 for the HTTPS-redirect + header requirements.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server_tokens off;

server {
  listen 8080;
  server_name _;

  client_max_body_size 15m;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
